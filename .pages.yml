# Pages CMS configuration — https://pagescms.org/docs
media:
  input: media
  output: media
  rename: safe
  extensions: [jpg, jpeg, png, webp, gif, mp4]

content:
  # ── Home: image fire ──────────────────────────
  - name: home
    label: Home (image fire)
    type: file
    path: content/home.json
    format: json
    fields:
      - name: slides
        label: Photographs
        type: object
        description: The photographs fired onto the home page, in random order. The more, the better.
        list:
          collapsible:
            collapsed: true
            summary: "{index} — {image}"
        fields:
          - name: image
            label: Image
            type: image
            required: true
            options:
              path: media/home
          - name: project
            label: Linked project
            type: reference
            description: Optional. When a visitor pauses on this photograph, its project title is shown as a link.
            options:
              collection: projects
              value: "{path}"
              label: "{title}"

  # ── Research and Commissions pages ────────────
  - name: research
    label: Research page
    type: file
    path: content/research.json
    format: json
    fields:
      - name: show_intro
        label: Show intro
        type: boolean
        default: true
        description: Off = the page starts straight with the list of projects.
      - name: statement
        label: Statement (large text)
        type: string
      - name: intro
        label: Introduction (small text next to the statement)
        type: text
        description: Use [text](https://link) for links. Empty line = new paragraph.
      - name: button
        label: Button text
        type: string
        description: Opens an email to the address on Info. Leave empty for no button.
      - name: footer
        label: Footer line (large text at the bottom of the page and its projects)
        type: string

  - name: commissions
    label: Commissions page
    type: file
    path: content/commissions.json
    format: json
    fields:
      - name: show_intro
        label: Show intro
        type: boolean
        default: true
        description: Off = the page starts straight with the list of projects.
      - name: statement
        label: Statement (large text)
        type: string
      - name: intro
        label: Introduction (small text next to the statement)
        type: text
        description: Use [text](https://link) for links. Empty line = new paragraph.
      - name: button
        label: Button text
        type: string
        description: Opens an email to the address on Info. Leave empty for no button.
      - name: footer
        label: Footer line (large text at the bottom of the page and its projects)
        type: string

  # ── Menu ──────────────────────────────────────
  - name: menu
    label: Menu
    type: file
    path: content/menu.json
    format: json
    fields:
      - name: research
        label: Show "Research"
        type: boolean
        default: true
      - name: commissions
        label: Show "Commissions"
        type: boolean
        default: true
      - name: info
        label: Show "Info"
        type: boolean
        default: true
      - name: contact
        label: Show "Contact"
        type: boolean
        default: true
        description: Hidden pages still exist and can be reached by their link; they are only left out of the menu.

  # ── Projects ──────────────────────────────────
  - name: projects
    label: Projects
    type: collection
    path: content/projects
    format: json
    filename: "{fields.title}.json"
    view:
      fields: [title, section, order, draft]
      primary: title
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: draft
        label: Hidden (draft)
        type: boolean
        default: false
        description: Hidden projects are not shown on the site.
      - name: order
        label: Order
        type: number
        description: Position within its section (1 = first). Sets the catalogue number (C01, R01 …) and the "Next" sequence.
      - name: section
        label: Section
        type: select
        default: commission
        options:
          values:
            - { name: commission, label: Commission }
            - { name: personal, label: Research }
      - name: client
        label: Client
        type: string
      - name: type
        label: Type
        type: string
        description: e.g. Hospitality, Satellite imagery
      - name: location
        label: Location
        type: string
      - name: role
        label: Role
        type: string
      - name: year
        label: Year
        type: string
        description: Shown in the index and on the project page.
      - name: description
        label: Description
        type: text
        description: Use [text](https://link) for links. Empty line = new paragraph.
      - name: cover
        label: Cover image
        type: image
        description: Used in the index only when the project has no other images.
      - name: index
        label: Index images (up to 4)
        type: object
        list: true
        description: The four photographs shown for this project on the home page, all cropped to the same frame. Leave empty to use the first four images below.
        fields:
          - name: image
            label: Image
            type: image
          - name: alt
            label: Description (for screen readers)
            type: string
      - name: blocks
        label: Images & video
        type: block
        list:
          collapsible: true
        blockKey: type
        blocks:
          - name: images
            label: Images
            fields:
              - name: layout
                label: Layout
                type: select
                default: full
                options:
                  values:
                    - { name: full, label: Full width }
                    - { name: inset, label: "Centred, narrower" }
                    - { name: offset, label: Offset right + note }
                    - { name: row, label: Side by side }
              - name: images
                label: Images
                type: object
                list: true
                fields:
                  - name: image
                    label: Image or video (.mp4)
                    type: image
                  - name: caption
                    label: Caption
                    type: string
                  - name: alt
                    label: Description (for screen readers)
                    type: string
              - name: note
                label: Note (offset layout only)
                type: text
              - name: narrow
                label: Portrait image — make offset narrower
                type: boolean
          - name: vimeo
            label: Vimeo
            fields:
              - name: videos
                label: Videos
                type: object
                list: true
                description: One = full width. Two or more = side by side.
                fields:
                  - name: id
                    label: Vimeo ID (the number in the link)
                    type: string
                  - name: caption
                    label: Caption
                    type: string
      - name: credits
        label: Credits
        type: object
        list: true
        fields:
          - name: role
            label: Role
            type: string
          - name: name
            label: Name
            type: string

  # ── Info ──────────────────────────────────────
  - name: info
    label: Info
    type: file
    path: content/info.json
    format: json
    fields:
      - name: name
        label: Site name
        type: string
      - name: description
        label: Site description (for search engines)
        type: string
      - name: email
        label: Email
        type: string
        description: Shown in the header, the footer of every page and on Info.
      - name: instagram
        label: Instagram handle
        type: string
      - name: location
        label: Based in
        type: string
      - name: bio
        label: Bio (large text, left column)
        type: text
        description: Use [text](https://link) for links. Empty line = new paragraph.
      - name: sections
        label: Sections
        type: object
        description: Sections that are empty or still contain [placeholders] are not shown. Email and Instagram (above) are added to the right column automatically.
        list:
          collapsible:
            collapsed: true
            summary: "{title} — {column}"
        fields:
          - name: column
            label: Column
            type: select
            default: left
            description: "Left: under the bio. Middle: dated lists such as exhibitions. Right: contacts."
            options:
              values:
                - { name: left, label: Left }
                - { name: middle, label: Middle }
                - { name: right, label: Right }
          - name: title
            label: Heading
            type: string
          - name: style
            label: Style
            type: select
            default: text
            options:
              values:
                - { name: text, label: Small text }
                - { name: list, label: Dated list }
                - { name: large, label: Large text }
          - name: text
            label: Text (small or large style)
            type: text
          - name: entries
            label: Entries (dated list style)
            type: object
            list: true
            fields:
              - name: date
                label: Date
                type: string
              - name: text
                label: Text
                type: text
