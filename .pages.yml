# Pages CMS configuration — https://pagescms.org/docs
media:
  input: media
  output: media
  rename: safe
  extensions: [jpg, jpeg, png, webp, gif, mp4]

content:
  # ── Home carousel ─────────────────────────────
  - name: home
    label: Home (carousel)
    type: file
    path: content/home.json
    format: json
    list: true
    fields:
      - name: image
        label: Image
        type: image
        required: true
        options:
          path: media/home
      - name: project
        label: Linked project
        type: reference
        description: Optional. Shows the project title as the caption and links to it.
        options:
          collection: projects
          value: "{path}"
          label: "{title}"
      - name: focus
        label: Crop focus
        type: select
        description: Which part of the photo stays visible when it is cropped to the screen.
        default: center
        options:
          values:
            - { name: center, label: Centre }
            - { name: top, label: Top }
            - { name: bottom, label: Bottom }
            - { name: left, label: Left }
            - { name: right, label: Right }

  # ── Projects ──────────────────────────────────
  - name: projects
    label: Projects
    type: collection
    path: content/projects
    format: json
    filename: "{fields.title}.json"
    view:
      fields: [title, section, order, draft]
      primary: title
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: draft
        label: Hidden (draft)
        type: boolean
        default: false
        description: Hidden projects are not shown on the site.
      - name: order
        label: Order
        type: number
        description: Position in the project order (1 = first). Also sets the "Next project" sequence.
      - name: section
        label: Section
        type: select
        default: commission
        options:
          values:
            - { name: commission, label: Commission }
            - { name: personal, label: Personal }
      - name: client
        label: Client
        type: string
      - name: type
        label: Type
        type: string
        description: e.g. Hospitality, Satellite imagery
      - name: location
        label: Location
        type: string
      - name: role
        label: Role
        type: string
      - name: year
        label: Year
        type: string
        description: Stored, not shown on the site.
      - name: description
        label: Description
        type: text
        description: Use [text](https://link) for links. Empty line = new paragraph.
      - name: cover
        label: Cover image
        type: image
        description: Shown when hovering the project in the Work list.
      - name: blocks
        label: Images & video
        type: block
        list:
          collapsible: true
        blockKey: type
        blocks:
          - name: images
            label: Images
            fields:
              - name: layout
                label: Layout
                type: select
                default: full
                options:
                  values:
                    - { name: full, label: Full width }
                    - { name: inset, label: "Centred, narrower" }
                    - { name: offset, label: Offset right + note }
                    - { name: row, label: Side by side }
              - name: images
                label: Images
                type: object
                list: true
                fields:
                  - name: image
                    label: Image or video (.mp4)
                    type: image
                  - name: caption
                    label: Caption
                    type: string
                  - name: alt
                    label: Description (for screen readers)
                    type: string
              - name: note
                label: Note (offset layout only)
                type: text
              - name: narrow
                label: Portrait image — make offset narrower
                type: boolean
          - name: vimeo
            label: Vimeo
            fields:
              - name: videos
                label: Videos
                type: object
                list: true
                description: One = full width. Two or more = side by side.
                fields:
                  - name: id
                    label: Vimeo ID (the number in the link)
                    type: string
                  - name: caption
                    label: Caption
                    type: string
      - name: credits
        label: Credits
        type: object
        list: true
        fields:
          - name: role
            label: Role
            type: string
          - name: name
            label: Name
            type: string

  # ── Info ──────────────────────────────────────
  - name: info
    label: Info
    type: file
    path: content/info.json
    format: json
    fields:
      - name: name
        label: Site name
        type: string
      - name: description
        label: Site description (for search engines)
        type: string
      - name: bio
        label: Bio (large text, left column)
        type: text
        description: Use [text](https://link) for links. Empty line = new paragraph.
      - name: sections
        label: Sections
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title} — {column}"
        fields:
          - name: column
            label: Column
            type: select
            default: left
            options:
              values:
                - { name: left, label: Left }
                - { name: middle, label: Middle }
                - { name: right, label: Right }
          - name: title
            label: Heading
            type: string
          - name: style
            label: Style
            type: select
            default: text
            options:
              values:
                - { name: text, label: Small text }
                - { name: list, label: Dated list }
                - { name: large, label: Large text }
          - name: text
            label: Text (small or large style)
            type: text
          - name: entries
            label: Entries (dated list style)
            type: object
            list: true
            fields:
              - name: date
                label: Date
                type: string
              - name: text
                label: Text
                type: text
